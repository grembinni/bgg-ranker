services:
  - type: web
    name: bgg-ranker-proxy
    runtime: node
    plan: free
    region: oregon
    rootDir: proxy/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: ALLOWED_ORIGIN
        value: "*"
        sync: false
